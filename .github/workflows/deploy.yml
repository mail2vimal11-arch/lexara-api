name: Build and Deploy

# Builds the api image on GitHub-hosted runners, publishes to GHCR, then
# SSHes to the production VPS and rolls the api service to the new image.
#
# Required repository secrets (already configured):
#   VPS_HOST    — VPS hostname or IP
#   VPS_USER    — SSH user (must be in the docker group on the VPS)
#   VPS_SSH_KEY — private key whose public half is in ~/.ssh/authorized_keys
#
# VPS layout assumption:
#   /opt/lexara-api  is a clone of this repository, on branch `main`.
#   `docker compose` is available, and the user can run it without sudo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Deploy gate: no image is built or shipped unless the full suite passes.
  # (QA finding CI-1 — this workflow previously deployed with no test gate,
  # racing tests.yml which used a different deploy strategy.)
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/lexrisk_test
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          pytest tests/ -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and roll the api service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/lexara-api

            # Sync compose file + Traefik labels from main. The image itself
            # is already in GHCR; the working tree only needs to match what
            # docker-compose.yml references.
            git fetch --quiet origin main
            git reset --hard origin/main

            export API_TAG="sha-${{ needs.build.outputs.sha_short }}"
            echo "Rolling api to $API_TAG"

            docker compose pull api
            docker compose up -d api
            docker image prune -f

            # Wait for the new container to report healthy (per the Dockerfile
            # HEALTHCHECK that probes /status). Times out after ~150s to cover
            # FAISS bootstrap + clause seed on a cold start.
            echo "Waiting for api to become healthy..."
            for i in $(seq 1 15); do
              state=$(docker inspect --format '{{.State.Health.Status}}' lexara-api-api-1 2>/dev/null || echo "unknown")
              if [ "$state" = "healthy" ]; then
                echo "api is healthy after ${i} attempts"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "api never became healthy (last state: $state) — dumping logs:"
                docker compose logs --tail=100 api
                exit 1
              fi
              sleep 10
            done

            # End-to-end check through Traefik / TLS.
            if ! curl -fsS --max-time 10 https://api.lexara.tech/status; then
              echo "Container is healthy but public endpoint failed — Traefik routing issue?"
              docker compose logs --tail=50 api
              exit 1
            fi
            echo
            echo "Deploy of $API_TAG OK"
