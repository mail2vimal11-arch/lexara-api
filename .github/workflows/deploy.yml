name: Build and Deploy

# Builds the api image on GitHub-hosted runners, publishes to GHCR, then
# SSHes to the production VPS and rolls the api service to the new image.
#
# Required repository secrets (already configured):
#   VPS_HOST    — VPS hostname or IP
#   VPS_USER    — SSH user (must be in the docker group on the VPS)
#   VPS_SSH_KEY — private key whose public half is in ~/.ssh/authorized_keys
#
# VPS layout assumption:
#   /opt/lexara-api  is a clone of this repository, on branch `main`.
#   `docker compose` is available, and the user can run it without sudo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and roll the api service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/lexara-api

            # Sync compose file + Traefik labels from main. The image itself
            # is already in GHCR; the working tree only needs to match what
            # docker-compose.yml references.
            git fetch --quiet origin main
            git reset --hard origin/main

            export API_TAG="sha-${{ needs.build.outputs.sha_short }}"
            echo "Rolling api to $API_TAG"

            docker compose pull api
            docker compose up -d api
            docker image prune -f

            # Smoke test the new container against /status. Fall back to
            # public Traefik route after a short warm-up to also exercise TLS.
            sleep 6
            if ! curl -fsS --max-time 10 https://api.lexara.tech/status; then
              echo "Smoke test failed — dumping last 100 lines of api logs:"
              docker compose logs --tail=100 api
              exit 1
            fi
            echo
            echo "Deploy of $API_TAG OK"
